<script>
(function () {
    var el = document.getElementById('hero-typer');
    if (!el) return;

    var snippet = "def build():\n    if idea:\n        ship_it()\n\nmodel = load('gpt')\nwhile True:\n    y = model.run(x)\n    yield y";

    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        el.textContent = snippet;
        return;
    }

    var i = 0;
    var typing = true;

    function tick() {
        if (typing) {
            if (i <= snippet.length) {
                el.textContent = snippet.slice(0, i) + '▋';
                i++;
                setTimeout(tick, 35);
            } else {
                typing = false;
                setTimeout(tick, 1800);
            }
        } else {
            if (i > 0) {
                i -= 2;
                el.textContent = snippet.slice(0, Math.max(i, 0)) + '▋';
                setTimeout(tick, 15);
            } else {
                typing = true;
                setTimeout(tick, 400);
            }
        }
    }

    tick();
})();
</script>
